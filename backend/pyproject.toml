[project]
name = "local-planner"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<2.1",
  "alembic>=1.15,<2", "argon2-cffi>=23.1", "python-multipart>=0.0.20",
  "pillow>=11", "mcp>=1.26,<2", "pydantic-settings>=2.8,<3"
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.28", "ruff>=0.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

